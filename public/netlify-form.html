<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Netlify Form Declaration</title>
  </head>
  <body>
    <!--
      Static form declaration required for Netlify Forms build-time detection.
      This file is crawled by Netlify at build time to register the "intake" form.
      The React form submits via fetch to this file's path (/__forms.html) so that
      Netlify's form handler intercepts the POST instead of Next.js.
    -->
    <form
      name="intake"
      method="POST"
      data-netlify="true"
      data-netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="intake" />
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="tel" name="phone" />
      <input type="text" name="dog_name" />
      <select name="service">
        <option value="behavior">Behavior Modification</option>
        <option value="obedience">Advanced Obedience</option>
        <option value="board-train">Board &amp; Train</option>
        <option value="in-home">In-Home Training</option>
        <option value="group">Group Classes</option>
        <option value="rescue">Rescue / Adoption Adjustment (Free)</option>
      </select>
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
