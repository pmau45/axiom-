[build]
  command = "npm run build"
  publish = ".next"
  functions = ".netlify/functions"

[build.environment]
  NEXT_TELEMETRY_DISABLED = "1"
  NODE_VERSION = "20"
  # Google Ads conversion tag (gtag.js) — public client ID, safe to bake into builds
  NEXT_PUBLIC_GOOGLE_ADS_ID = "AW-18020403242"

# Include blog MDX in function bundles if /sitemap.xml or /blog run server-side.
[functions]
  included_files = ["app/blog/content/**"]

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Move the old Netlify subdomain to the custom domain for Google's Change of Address.
[[redirects]]
  from = "https://axiom-canine.netlify.app/*"
  to = "https://axiomcanine.dev/:splat"
  status = 301
  force = true

# Legacy route redirects (301 — preserve SEO equity)
[[redirects]]
  from = "/behavior"
  to = "/services/behavior-modification"
  status = 301

[[redirects]]
  from = "/behavior/*"
  to = "/services/behavior-modification"
  status = 301

[[redirects]]
  from = "/obedience"
  to = "/services/advanced-obedience"
  status = 301

[[redirects]]
  from = "/obedience/*"
  to = "/services/advanced-obedience"
  status = 301

# Sitemap — ensure correct MIME type and reasonable caching for crawlers
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600, must-revalidate"

# Cache static assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
